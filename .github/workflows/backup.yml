name: Weekly D1 Backup

# One-time setup: wrangler r2 bucket create lutterodt-backups
# Exports the production database and stores a gzipped snapshot in R2.
# Restore procedure: docs/runbook.md ("Disaster recovery").

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export D1 to R2
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          npx wrangler d1 export lutterodt-db --remote --output=/tmp/lutterodt-db.sql
          gzip -9 /tmp/lutterodt-db.sql
          npx wrangler r2 object put "lutterodt-backups/d1-${STAMP}.sql.gz" --file=/tmp/lutterodt-db.sql.gz --remote
          echo "Backup stored: d1-${STAMP}.sql.gz"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Alert on failure (GitHub issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[alert] Weekly D1 backup failed"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. No fresh snapshot this week — fix before next Sunday."
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --label "operations" --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "Still failing. $BODY"
          fi

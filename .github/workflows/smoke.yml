name: Production Smoke

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npx playwright test --project=smoke

      - name: Alert on failure (GitHub issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="[alert] Production smoke tests failing"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Check https://lutterodt.org/api/health and the worker logs."
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --label "operations" --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "Still failing. $BODY"
          fi
